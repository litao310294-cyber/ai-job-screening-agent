spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false

app:
  versions:
    resume-parser:
      prompt: resume-v1
      model: gpt-4o
      schema: profile-v1
      temperature: 0.0
      top-p: 1.0
      max-output-tokens: 4000
      response-format: json_object
    requirement-parser:
      prompt: requirement-parser-v2
      model: gpt-4o
      schema: requirement-set-v2
      temperature: 0.0
      top-p: 1.0
      max-output-tokens: 2000
      response-format: json_object
    final-analysis:
      prompt: final-analysis-v2
      model: gpt-4o
      schema: job-analysis-v2
      temperature: 0.0
      top-p: 1.0
      max-output-tokens: 4000
      response-format: json_object
