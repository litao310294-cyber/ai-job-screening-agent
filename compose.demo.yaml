services:
  mysql:
    image: mysql:8.4
    container_name: ai-job-assistant-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEMO_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:?Set DEMO_MYSQL_ROOT_PASSWORD in .env.demo.local}
      MYSQL_DATABASE: ai_job_analyzer
      MYSQL_USER: ai_job_demo
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?Set DEMO_MYSQL_PASSWORD in .env.demo.local}
    volumes:
      - ai_job_assistant_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    container_name: ai-job-assistant-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEMO_REDIS_PORT:-6380}:6379"
    volumes:
      - ai_job_assistant_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis-test:
    profiles: [test]
    image: redis:7.4-alpine
    container_name: ai-job-assistant-test-redis
    ports:
      - "127.0.0.1:${DEMO_TEST_REDIS_PORT:-6383}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai_job_assistant_test_redis_data:/data
volumes:
  ai_job_assistant_mysql_data:
    name: ai_job_assistant_mysql_data
  ai_job_assistant_redis_data:
    name: ai_job_assistant_redis_data
  ai_job_assistant_test_redis_data:
    name: ai_job_assistant_test_redis_data
